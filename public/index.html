<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BON PLAN 229</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap nav">
    <strong>BON PLAN <span>229</span></strong>
    <div>
      <button class="secondary" onclick="openMyListings()">Mes annonces</button>
      <button onclick="openPublish()">+ Vendre</button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <p>ACHETER • VENDRE • TROUVER • ÉCONOMISER</p>
    <h1>Les bonnes affaires, simplement.</h1>
    <div class="search">
      <input id="search" placeholder="Que cherchez-vous ?" oninput="loadListings()">
      <select id="zone" onchange="loadListings()">
        <option value="">Toute zone</option>
      </select>
    </div>
  </div>
</section>

<main class="wrap">
  <div id="categories" class="categories"></div>
  <div class="head">
    <h2>Annonces</h2>
    <button class="secondary" onclick="openSearch()">🔎 Je cherche</button>
  </div>
  <div id="listings" class="grid"></div>
</main>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()">
  <div class="dialog">
    <button class="close" onclick="closeModal()">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
